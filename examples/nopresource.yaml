apiVersion: nop.crossplane.io/v1alpha1
kind: NopResource
metadata:
  name: example
  namespace: default
spec:
  forProvider:
    # The NopResource spec.forProvider.fields is an arbitrary,
    # schemaless object. Use it to patch to and from.
    # status.atProvider.fields works the same.
    fields:
      integerField: 42
      stringField: "cool"
      objectField:
        stringField: "cool"
      arrayField:
      - stringField: "cool"
    # This NopResource will set its 'Ready' status condition to 'True'
    # after 30 seconds, etc. Note that these conditions will only be processed
    # as frequently as the provider's --poll-interval, which defaults to 10s.
    # This means that by default granularity of less than 10s is ignored.
    conditionAfter:
    - time: 30s
      conditionType: Ready
      conditionStatus: "True"
    - time: 60s
      conditionType: Ready
      conditionStatus: "False"
    - time: 90s
      conditionType: Ready
      conditionStatus: "True"
    - time: 90s
      conditionType: Green
      conditionStatus: "True"
    # A NopResource is deleted immediately unless told otherwise. deleteAfter
    # is the minimum time its deletion takes - it reports that its external
    # resource still exists until at least that long after its deletion
    # timestamp - and deleteError makes deletion fail with that message every
    # time, so the resource is never deleted at all. deleteError takes
    # precedence over deleteAfter. Both are useful for testing deletion
    # ordering, and what depends on a resource that will not go away.
    # deleteAfter: 30s
    # deleteError: "cannot delete: still in use"
    # The NopResource will emit whatever connection details it is told
    # to have. These are all plaintext - for testing only.
    connectionDetails:
    - name: username
      value: fakeuser
    - name: password
      value: verysecurepassword
    - name: endpoint
      value: 127.0.0.1
  # Like all managed resources the NopResource allows you to configure a
  # provider config. It ignores the configured value.
  providerConfigRef:
    name: default
  # Simulating connection details (see connectionDetails above) works
  # only when the NopResource writes a connection secret.
  writeConnectionSecretToRef:
    namespace: default
    name: nop-example-resource